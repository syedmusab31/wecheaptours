name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wecheaptours_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Dummy values: the build must not need real secrets.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wecheaptours_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wecheaptours_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-only-cron-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Production builds require SMTP (admins sign in with emailed codes); nothing is sent in CI
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when the schema changed but nobody ran `npm run db:generate` (an un-migrated change)
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::The schema has changes without a migration. Run: npm run db:generate -- --name <what-changed>"
            git status --porcelain drizzle
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
